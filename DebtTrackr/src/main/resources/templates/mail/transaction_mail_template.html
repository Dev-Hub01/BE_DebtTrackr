<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Summary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
        }

        h2 {
            color: #2c3e50;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .total-box {
            margin-top: 20px;
            padding: 12px;
            background-color: #e8f5e9;
            border-left: 5px solid #4CAF50;
            font-size: 16px;
            font-weight: bold;
        }

        .footer {
            margin-top: 20px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Hello <span th:text="${name}">User</span>,</h2>

    <p>
        Here is the summary of your recent payments:
    </p>

    <table>
        <thead>
        <tr>
            <th>Transaction ID</th>
            <th>Amount Paid (₹)</th>
            <th>Payment Mode</th>
            <th>Reference</th>
            <th>Date</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="item : ${payments}">
            <td th:text="${item.transactionId}">TX123</td>
            <td th:text="${item.amount}">100</td>
            <td th:text="${item.paymentMode}">UPI</td>
            <td th:text="${item.reference}">UPI123</td>
            <td th:text="${#temporals.format(item.date, 'dd-MM-yyyy HH:mm')}">2026-04-07</td>
        </tr>
        </tbody>
    </table>

    <div class="total-box">
        Total Amount Paid: ₹ <span th:text="${totalAmount}">0</span>
    </div>

    <div class="footer">
        <p>Thank you for using our service.</p>
    </div>

</div>

</body>
</html>
